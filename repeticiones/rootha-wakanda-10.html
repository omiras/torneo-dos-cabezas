<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repetición · Commander dos cabezas</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111719; color: #ebefea }
  * { box-sizing: border-box }
  body { max-width: 1600px; margin: auto; padding: clamp(.75rem, 2vw, 2rem) }
  :root:fullscreen { overflow: auto }
  :root:fullscreen body { max-width: none }
  header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: .75rem }
  h1 { font-size: clamp(1.7rem, 5vw, 3rem); margin: 0 }
  h2, h3, p { margin: 0 0 .75rem }
  header p, small { color: #bccac6 }
  nav { display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: center; margin: 1.5rem 0 .5rem }
  nav output { text-align: center; font-weight: 700 }
  button, select { background: #293735; color: inherit; font: inherit; border: 1px solid #49625a; padding: .55rem .7rem; border-radius: .4rem }
  button { cursor: pointer }
  button:disabled { opacity: .45; cursor: default }
  .step { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .6rem; margin-bottom: 1rem }
  #teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem }
  .team { min-width: 0; border: 1px solid #465955; border-top: 4px solid #6ac5a5; border-radius: .7rem; padding: 1rem; background: #1a2324 }
  .team:nth-child(2) { border-top-color: #e5aa75 }
  .team-title { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem }
  .life { color: #d6efab; font-size: .9rem; font-variant-numeric: tabular-nums }
  .board + .board { margin-top: 1rem; border-top: 1px solid #465955; padding-top: 1rem }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: .4rem; padding: 0; list-style: none }
  .cards li { padding: .5rem; background: #273735; border-radius: .4rem; overflow-wrap: anywhere }
  .cards li.land { background: #33362d }
  a { color: inherit; text-underline-offset: .2em }
  .cards small { display: block }
  .card-link { display: flex; align-items: center; gap: .5rem; min-width: 0 }
  .cards .card-link { flex-direction: column; gap: .3rem; text-align: center; font-size: .78rem; line-height: 1.25 }
  .thumb { flex: 0 0 auto; display: grid; place-items: center; width: 29px; aspect-ratio: 5 / 7; border-radius: .25rem; background: #182322; color: #a7c7b9 }
  .cards .thumb { width: min(100%, 66px) }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: inherit }
  .thumb img[hidden] { display: none }
  #actions { columns: 2; padding-inline-start: 1.5rem }
  #actions li { break-inside: avoid; margin-bottom: .35rem }
  #combat li { margin-bottom: .55rem }
  .combat-detail { display: block; margin-inline-start: 2.3rem }
  .action-kind { color: #bccac6; font-size: .8rem }
  .log { margin-top: 1.5rem }
  @media (max-width: 680px) { #teams { grid-template-columns: 1fr } #actions { columns: 1 } }
</style>
<header>
  <div>
    <h1>Repetición de la partida</h1>
    <p id="match"></p>
    <p id="result"></p>
  </div>
  <button id="fullscreen" type="button" aria-pressed="false">⛶ Pantalla completa</button>
</header>
<p id="fullscreen-status" role="status" hidden></p>
<nav aria-label="Controles de la repetición">
  <button id="previous" type="button" aria-label="Turno anterior">← <span>Anterior</span></button>
  <output id="turn-number" aria-live="polite"></output>
  <button id="next" type="button" aria-label="Turno siguiente"><span>Siguiente</span> →</button>
</nav>
<div class="step"><label for="turn">Ir al turno</label><select id="turn"></select><span id="active"></span></div>
<main id="teams"></main>
<section class="log" aria-labelledby="combat-title">
  <h2 id="combat-title">Combate del turno</h2>
  <ol id="combat"></ol>
  <p id="no-combat" hidden></p>
</section>
<section class="log" aria-labelledby="log-title"><h2 id="log-title">Jugadas del turno</h2><ol id="actions"></ol><p id="no-actions" hidden>Sin hechizos ni cambios registrados en mesa.</p></section>

:"Ninja Token","target":"Loyal Retainers","player":"AI 1"}]}]}</script>
<script>
  const data = JSON.parse(document.querySelector('#replay-data').textContent);
  const byId = id => document.getElementById(id);
  const labels = new Map(data.players.map((name, i) => ['AI ' + (i + 1), name]));
  const teamName = team => data.players.slice((team - 1) * 2, team * 2).join(' + ');
  const element = (tag, text) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const hiddenCardName = 'Carta boca abajo';
  const tokenNames = new Set(data.frames.flatMap(frame => frame.boards.flatMap(board =>
    board.cards.filter(card => card.token && !card.hidden).map(card => card.name))));
  const images = new Map();
  let imageQueue = Promise.resolve();
  const tokenQuery = name => 't:token !"' + name.replace(/ Token$/, '') + '"';

  async function cacheImage(key, url) {
    if (!url) return null;
    try {
      const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
      if (response.ok) {
        const blob = await response.blob();
        if (/^image\/(jpeg|png|webp)$/.test(blob.type) && blob.size <= 64000) {
          const encoded = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
          try { localStorage.setItem(key, encoded); } catch { /* The thumbnail still works in this session. */ }
          return encoded;
        }
      }
    } catch { /* Use the original image if storage or the CDN request is restricted. */ }
    return url;
  }

  function thumbnailUrl(name, token) {
    const key = 'replay:scryfall:small:v1:' + JSON.stringify([name, token]);
    if (!images.has(key)) {
      try {
        const stored = localStorage.getItem(key);
        if (stored && /^data:image\/(jpeg|png|webp);base64,/.test(stored)) {
          images.set(key, Promise.resolve(stored));
          return images.get(key);
        }
      } catch { /* Private or restricted contexts may not expose storage. */ }
      const request = imageQueue.then(async () => {
        const url = token
          ? 'https://api.scryfall.com/cards/search?include_extras=true&q=' + encodeURIComponent(tokenQuery(name))
          : 'https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(name);
        const response = await fetch(url, {
          headers: { Accept: 'application/json;q=0.9,*/*;q=0.8' },
          signal: AbortSignal.timeout(5000),
        });
        if (!response.ok) return null;
        const result = await response.json();
        const card = token ? result.data?.[0] : result;
        const imageUrl = card?.image_uris?.small ??
          card?.card_faces?.find(face => face.name === name)?.image_uris?.small ??
          card?.card_faces?.[0]?.image_uris?.small;
        return cacheImage(key, imageUrl);
      }).catch(() => null);
      images.set(key, request);
      imageQueue = request.then(() => new Promise(resolve => setTimeout(resolve, 140)));
    }
    return images.get(key);
  }

  function cardLink(name, token = false, hidden = false, kind = '') {
    const link = element(hidden ? 'span' : 'a');
    link.className = 'card-link';
    const thumb = element('span', '▤');
    thumb.className = 'thumb';
    thumb.setAttribute('aria-hidden', 'true');
    const text = element('span');
    if (kind) {
      const action = element('small', kind);
      action.className = 'action-kind';
      text.append(action, element('br'));
    }
    text.append(element('span', name));
    link.append(thumb, text);
    if (!hidden) {
      const query = token ? tokenQuery(name) : '!"' + name + '"';
      link.href = 'https://scryfall.com/search?q=' + encodeURIComponent(query);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      thumbnailUrl(name, token).then(url => {
        if (!url || !thumb.isConnected) return;
        const image = element('img');
        image.alt = '';
        image.hidden = true;
        image.addEventListener('load', () => {
          image.hidden = false;
          thumb.replaceChildren(image);
        }, { once: true });
        image.src = url;
      });
    }
    return link;
  }

  const fullscreen = byId('fullscreen');
  const fullscreenStatus = byId('fullscreen-status');
  document.addEventListener('fullscreenchange', () => {
    const active = Boolean(document.fullscreenElement);
    fullscreen.textContent = active ? 'Salir de pantalla completa' : '⛶ Pantalla completa';
    fullscreen.setAttribute('aria-pressed', String(active));
  });
  fullscreen.addEventListener('click', async () => {
    fullscreenStatus.hidden = true;
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {
      fullscreenStatus.textContent = 'Si el navegador bloquea este modo, abre el HTML directamente y usa F11.';
      fullscreenStatus.hidden = false;
    }
  });
  byId('match').textContent = teamName(1) + ' contra ' + teamName(2);
  byId('result').textContent = Number(data.winner) ? 'Ganó ' + teamName(Number(data.winner)) : 'Empate';
  const frames = data.frames;
  const label = frame => 'Turno ' + frame.turn + (frame.finished ? ' · final de partida' : '');
  frames.forEach((frame, i) => {
    const option = element('option', label(frame));
    option.value = i;
    byId('turn').append(option);
  });
  let current = 0;
  function render(index) {
    current = Math.max(0, Math.min(frames.length - 1, index));
    const frame = frames[current];
    byId('turn').value = current;
    byId('turn-number').textContent = label(frame);
    byId('active').textContent = frame.activeTeam ? 'Turno del equipo ' + frame.activeTeam : '';
    byId('previous').disabled = current === 0;
    byId('next').disabled = current === frames.length - 1;
    byId('teams').replaceChildren(...[1, 2].map(team => {
      const panel = element('section');
      panel.className = 'team';
      const boards = frame.boards.filter(board => board.team === team);
      const title = element('h2', 'Equipo ' + team);
      title.className = 'team-title';
      const life = boards.find(board => Number.isInteger(board.life))?.life;
      const counter = element('span', Number.isInteger(life) ? life + ' vidas' : 'Vidas sin registro');
      counter.className = 'life';
      title.append(counter);
      panel.append(title);
      boards.forEach(board => {
        const field = element('div');
        field.className = 'board';
        field.append(element('h3', labels.get(board.player) || board.player));
        const cards = element('ul');
        cards.className = 'cards';
        for (const card of [...board.cards].sort((a, b) => Number(a.land) - Number(b.land))) {
          const item = element('li');
          if (card.land) item.className = 'land';
          item.append(cardLink(card.name, card.token, card.hidden));
          const detail = [card.token && 'Ficha', card.tapped && 'Girada'].filter(Boolean).join(' · ');
          if (detail) item.append(element('small', detail));
          cards.append(item);
        }
        field.append(cards.childElementCount ? cards : element('p', 'Mesa vacía.'));
        panel.append(field);
      });
      return panel;
    }));
    const combat = frame.combat ?? [];
    const combatList = byId('combat');
    combatList.replaceChildren(...combat.map(action => {
      const item = element('li');
      const owner = labels.get(action.player) || action.player;
      item.append(cardLink(action.card, tokenNames.has(action.card), action.card === hiddenCardName,
        'Combate ' + action.combat + ' · ' + owner + ' · ' + action.kind));
      const target = labels.get(action.target) || action.target;
      const detail = element('small', (action.kind === 'Bloquea' ? 'Bloquea a ' : 'Ataca a ') + target);
      detail.className = 'combat-detail';
      item.append(detail);
      return item;
    }));
    const noCombat = byId('no-combat');
    noCombat.hidden = combat.length > 0;
    noCombat.textContent = frame.combat ? 'Sin atacantes ni bloqueadores declarados.' : 'Esta partida no tiene registro de combate.';
    byId('actions').replaceChildren(...frame.actions.map(action => {
      const item = element('li');
      item.append(cardLink(action.card, tokenNames.has(action.card), action.card === hiddenCardName, action.kind));
      return item;
    }));
    byId('no-actions').hidden = frame.actions.length > 0;
  }
  byId('previous').addEventListener('click', () => render(current - 1));
  byId('next').addEventListener('click', () => render(current + 1));
  byId('turn').addEventListener('change', event => render(Number(event.target.value)));
  document.addEventListener('keydown', event => {
    if (event.target.matches('select, button, a') || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowLeft') render(current - 1);
    if (event.key === 'ArrowRight') render(current + 1);
  });
  render(0);
</script>
</html>
